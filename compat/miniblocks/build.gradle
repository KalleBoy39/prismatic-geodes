plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// The Prismatic Geodes jar this addon is built for (blocks + their textures). Only on the dev/test runtime
// classpath; the shipped jar contains nothing of it. The released jar if present, else the one built by the main
// project (run `gradlew build` in the repository root first).
def vplusGeodesName = "prismatic-geodes-1.0.0+${project.minecraft_version}.jar"
def vplusGeodesJar = file("../../release/$vplusGeodesName").exists() ? file("../../release/$vplusGeodesName") : file("../../build/libs/$vplusGeodesName")

loom {
	runs {
		// Disposable dev run directories, never the real .minecraft
		client {
			runDir = 'run/client'
		}
		server {
			runDir = 'run/server'
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "vplus_geodes_miniblocks_test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // dev/test runs only; accepts the Minecraft EULA for the disposable test server
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	runtimeOnly files(vplusGeodesJar)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	from("../../LICENSE") {
		rename { "${it}_prismatic-geodes-miniblocks" }
	}
	// the MIT licence covers the code only; this says which files keep Mojang's or Vanilla Tweaks' terms
	from("../../THIRD-PARTY-NOTICES.md") {
		rename { "THIRD-PARTY-NOTICES_prismatic-geodes-miniblocks.md" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial']
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
