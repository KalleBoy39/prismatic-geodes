plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		// Disposable dev run directories, never the real .minecraft
		client {
			runDir = 'run/client'
		}
		server {
			runDir = 'run/server'
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "vplus_geodes_test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // dev/test runs only; accepts the Minecraft EULA for the disposable test server
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	// the MIT licence covers the code only; this says which files keep Mojang's terms
	from("THIRD-PARTY-NOTICES.md") {
		rename { "THIRD-PARTY-NOTICES_${projectName}.md" }
	}
}
